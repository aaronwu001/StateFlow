services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stateflow
      POSTGRES_PASSWORD: stateflow
      POSTGRES_DB: stateflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      # No init-script mount: schema migrations are applied by the
      # `stateflow` service itself at startup, via golang-migrate's Go
      # library (migrations/apply.go), before RecoverRuns runs — see
      # cmd/stateflow/main.go. This replaced the previous mechanism
      # (mounting migrations/001_initial.sql into
      # /docker-entrypoint-initdb.d/, applied only by Postgres's first-boot
      # hook) because that mechanism could not apply a second migration to
      # an existing data volume and required a full `down -v` reset for
      # every schema change (Temporary Design Registry item #7, whitepaper
      # §18). A bare `postgres:16` with an empty volume now starts with no
      # StateFlow schema at all until `stateflow` connects and migrates it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stateflow -d stateflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  stateflow:
    build: .
    environment:
      DATABASE_URL: postgres://stateflow:stateflow@postgres:5432/stateflow?sslmode=disable
      LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
    healthcheck:
      # Distroless has no shell/curl/wget, so this invokes the binary's own
      # `healthcheck` subcommand (cmd/stateflow/main.go), which HTTP-GETs
      # this same process's GET /healthz (internal/api/server.go). Closes
      # Temporary Design Registry item #8 (whitepaper §18).
      test: ["CMD", "/stateflow", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    # The demo overlay (docker-compose.demo.yml) runs workers/planner as
    # compose services reachable by name (step1, ocr-worker, etc.) — this
    # entry only matters if you point a workflow at a worker running directly
    # on the host instead. Required on Linux Docker Engine for that case;
    # Docker Desktop (Mac/Windows) resolves host.docker.internal without it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
